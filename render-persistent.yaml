# Render blueprint with real persistence — requires a PAID instance type.
#
# Use this instead of render.yaml when salary data must survive a redeploy. Rename it to
# render.yaml (Render only reads that filename), then seed once from the service Shell:
#
#   DATABASE_PATH=/var/data/salary.sqlite npm run seed
#
# SEED_ON_BOOT is deliberately absent: with a real disk the database should be seeded
# once, deliberately, not regenerated by a process restart.
services:
  - type: web
    name: acme-salary-management
    runtime: node
    plan: starter
    # --include=dev is required, not optional. Render sets NODE_ENV=production for the
    # whole service, and npm ci then skips devDependencies — which is where vite and tsup
    # live. Without this the build fails with "vite: not found".
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_PATH
        value: /var/data/salary.sqlite
    disk:
      name: salary-data
      mountPath: /var/data
      sizeGB: 1

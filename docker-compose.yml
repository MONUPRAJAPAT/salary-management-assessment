# docker compose up --build   →  http://localhost:4000
#
# Seed once, the first time:
#   docker compose run --rm app node packages/server/dist/seed.js

services:
  app:
    build: .
    ports:
      # Host port is overridable, because 4000 is a popular port and a reviewer who
      # already has something on it should not have to edit this file:
      #   HOST_PORT=4500 docker compose up
      - '${HOST_PORT:-4000}:4000'
    volumes:
      # SQLite needs a persistent path. Without this the database is recreated empty
      # every time the container is replaced.
      - salary-data:/data
    environment:
      NODE_ENV: production
      PORT: '4000'
      DATABASE_PATH: /data/salary.sqlite
    restart: unless-stopped

volumes:
  salary-data:

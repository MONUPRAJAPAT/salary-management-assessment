# Render blueprint: New → Blueprint → pick this repository.
#
# This is the FREE configuration. Render's persistent disks require a paid instance type,
# so there is no disk here — the filesystem is wiped whenever the container is replaced.
# SEED_ON_BOOT compensates: the app generates its 10,000-employee dataset at startup if
# the database is empty, which takes well under a second and is deterministic, so every
# visitor sees exactly the same organisation.
#
# What that costs you: data resets when the instance spins down (~15 minutes idle) or on
# redeploy. Within a session nothing is lost — a reviewer can record a raise and see it
# reflected everywhere. For real persistence, see docs/deployment.md.
services:
  - type: web
    name: acme-salary-management
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      # /tmp is reliably writable on an instance with no mounted disk.
      - key: DATABASE_PATH
        value: /tmp/salary.sqlite
      - key: WEB_DIST_PATH
        value: ./packages/web/dist
      - key: SEED_ON_BOOT
        value: 'true'

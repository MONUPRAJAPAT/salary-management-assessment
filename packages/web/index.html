<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ACME Salary Management</title>
    <meta name="description" content="Salary management for ACME — 10,000 employees across 10 countries." />
    <script>
      // Paint the right theme before React boots. Without this the page flashes light
      // and then snaps to dark, which is the most noticeable bug a theme toggle has.
      (function () {
        try {
          var stored = localStorage.getItem('mantine-color-scheme-value');
          var scheme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-mantine-color-scheme', scheme);
        } catch (e) {
          /* private mode, blocked storage — fall through to Mantine's own default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
